<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1560" viewBox="0 0 1180 1560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="1560" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#111">Lemma — low-fidelity UI sketches</text>
  <text x="40" y="62" font-size="13" fill="#666" font-style="italic">Monochrome and rough on purpose. Layout and interaction only; no visual design.</text>

  <!-- ============ PANEL 1: TOPIC VIEW ============ -->
  <g transform="translate(40,100)">
    <text x="0" y="-10" font-size="13" font-weight="bold" fill="#111">1 · Topic view</text>
    <rect x="0" y="0" width="520" height="400" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="34" fill="#eee" stroke="#333" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="bold" fill="#111">Lemma</text>
    <text x="430" y="22" font-size="12" fill="#444">Queue · Tags</text>

    <text x="20" y="62" font-size="16" font-weight="bold" fill="#111">compactness</text>
    <text x="20" y="80" font-size="12" fill="#666">6 points · 18.100</text>

    <line x1="20" y1="94" x2="500" y2="94" stroke="#ccc"/>
    <g font-size="13" fill="#222">
      <circle cx="28" cy="116" r="3" fill="#555"/><text x="42" y="120">open cover definition</text>
      <circle cx="28" cy="146" r="3" fill="#555"/><text x="42" y="150">finite subcover argument</text>
      <circle cx="28" cy="176" r="3" fill="#555"/><text x="42" y="180">why closed and bounded isn't enough</text>
      <circle cx="28" cy="206" r="3" fill="#555"/><text x="42" y="210">Heine–Borel statement</text>
      <circle cx="28" cy="236" r="3" fill="#555"/><text x="42" y="240">compactness implies closed in Hausdorff</text>
      <circle cx="28" cy="266" r="3" fill="#555"/><text x="42" y="270">sequential vs open-cover compactness</text>
    </g>
    <rect x="410" y="136" width="86" height="20" rx="3" fill="#f0f0f0" stroke="#999" stroke-dasharray="3 2"/>
    <text x="418" y="150" font-size="10" fill="#555">has a card</text>

    <text x="20" y="302" font-size="12" fill="#06c">+ add a point</text>
    <line x1="20" y1="320" x2="500" y2="320" stroke="#ccc"/>

    <rect x="20" y="338" width="190" height="38" rx="4" fill="#333"/>
    <text x="48" y="362" font-size="13" fill="#fff" font-weight="bold">Start recall check</text>
    <rect x="224" y="338" width="120" height="38" rx="4" fill="#fff" stroke="#666"/>
    <text x="246" y="362" font-size="13" fill="#333">Review cards</text>
  </g>
  <text x="40" y="528" font-size="12" fill="#666" font-style="italic">A point is one line of text. Most never get a question or answer — the dashed chip marks the one that has.</text>

  <!-- ============ PANEL 2: COMMIT ============ -->
  <g transform="translate(620,100)">
    <text x="0" y="-10" font-size="13" font-weight="bold" fill="#111">2 · Commit</text>
    <rect x="0" y="0" width="520" height="400" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="34" fill="#eee" stroke="#333" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="bold" fill="#111">Lemma</text>

    <text x="20" y="62" font-size="16" font-weight="bold" fill="#111">What will you cover?</text>

    <text x="20" y="92" font-size="11" fill="#666">NAME THIS SESSION</text>
    <rect x="20" y="100" width="480" height="32" rx="4" fill="#fff" stroke="#666"/>
    <text x="32" y="121" font-size="13" fill="#222">Explain compactness</text>

    <text x="20" y="160" font-size="11" fill="#666">POINTS YOU COMMIT TO</text>
    <g font-size="13" fill="#222">
      <rect x="22" y="172" width="13" height="13" rx="2" fill="#333"/><text x="38" y="184" font-size="10" fill="#fff">✓</text><text x="48" y="183">open cover definition</text>
      <rect x="22" y="200" width="13" height="13" rx="2" fill="#333"/><text x="38" y="212" font-size="10" fill="#fff">✓</text><text x="48" y="211">finite subcover argument</text>
      <rect x="22" y="228" width="13" height="13" rx="2" fill="#333"/><text x="38" y="240" font-size="10" fill="#fff">✓</text><text x="48" y="239">why closed and bounded isn't enough</text>
      <rect x="22" y="256" width="13" height="13" rx="2" fill="#333"/><text x="38" y="268" font-size="10" fill="#fff">✓</text><text x="48" y="267">Heine–Borel statement</text>
      <rect x="22" y="284" width="13" height="13" rx="2" fill="#fff" stroke="#666"/><text x="48" y="295">compactness implies closed in Hausdorff</text>
      <rect x="22" y="312" width="13" height="13" rx="2" fill="#fff" stroke="#666"/><text x="48" y="323">sequential vs open-cover compactness</text>
    </g>

    <rect x="20" y="346" width="150" height="36" rx="4" fill="#333"/>
    <text x="62" y="369" font-size="13" fill="#fff" font-weight="bold">Begin</text>
    <text x="186" y="369" font-size="11" fill="#777" font-style="italic">4 of 6 selected</text>
  </g>
  <text x="620" y="528" font-size="12" fill="#666" font-style="italic">Commitment happens before anything is hidden. Choosing afterwards would let you pick what you happened to say.</text>

  <!-- ============ PANEL 3: RECORDING ============ -->
  <g transform="translate(40,590)">
    <text x="0" y="-10" font-size="13" font-weight="bold" fill="#111">3 · Recording</text>
    <rect x="0" y="0" width="520" height="400" rx="6" fill="#fafafa" stroke="#333" stroke-width="1.5"/>

    <text x="260" y="130" font-size="15" fill="#555" text-anchor="middle">Explain compactness</text>
    <text x="260" y="196" font-size="44" font-weight="bold" fill="#111" text-anchor="middle">02:14</text>

    <circle cx="260" cy="258" r="6" fill="#c33"/>
    <text x="278" y="263" font-size="12" fill="#777">listening</text>

    <rect x="190" y="300" width="140" height="44" rx="22" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="260" y="328" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Stop</text>

    <text x="260" y="372" font-size="11" fill="#999" text-anchor="middle">Your account is not saved.</text>

    <rect x="36" y="46" width="448" height="44" rx="4" fill="none" stroke="#bbb" stroke-dasharray="5 4"/>
    <text x="260" y="73" font-size="12" fill="#aaa" text-anchor="middle" font-style="italic">(your committed points were here)</text>
  </g>
  <text x="40" y="1018" font-size="12" fill="#666" font-style="italic">Nearly empty on purpose. The dashed box is not drawn in the real screen — it marks what has been hidden.</text>

  <!-- ============ PANEL 4: RESULTS ============ -->
  <g transform="translate(620,590)">
    <text x="0" y="-10" font-size="13" font-weight="bold" fill="#111">4 · Results</text>
    <rect x="0" y="0" width="520" height="400" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="34" fill="#eee" stroke="#333" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="bold" fill="#111">Explain compactness — 4 min</text>

    <text x="20" y="60" font-size="12" font-weight="bold" fill="#111">SAID (2)</text>
    <g font-size="13" fill="#222">
      <text x="20" y="84">open cover definition</text>
      <rect x="392" y="70" width="108" height="20" rx="3" fill="#fff" stroke="#999"/>
      <text x="400" y="84" font-size="10" fill="#555">move to not said</text>

      <text x="20" y="112">Heine–Borel statement</text>
      <rect x="392" y="98" width="108" height="20" rx="3" fill="#fff" stroke="#999"/>
      <text x="400" y="112" font-size="10" fill="#555">move to not said</text>
    </g>

    <line x1="20" y1="132" x2="500" y2="132" stroke="#ccc"/>
    <text x="20" y="156" font-size="12" font-weight="bold" fill="#111">NOT SAID (2)</text>
    <g font-size="13" fill="#222">
      <text x="20" y="180">finite subcover argument</text>
      <rect x="418" y="166" width="82" height="20" rx="3" fill="#fff" stroke="#999"/>
      <text x="426" y="180" font-size="10" fill="#555">I did say it</text>

      <text x="20" y="208">why closed and bounded isn't enough</text>
      <rect x="418" y="194" width="82" height="20" rx="3" fill="#fff" stroke="#999"/>
      <text x="426" y="208" font-size="10" fill="#555">I did say it</text>
    </g>

    <rect x="20" y="232" width="480" height="48" rx="4" fill="#f7f7f7" stroke="#ddd"/>
    <text x="32" y="252" font-size="11" fill="#555">Matched by keyword, not by a model. If it got one wrong, fix it —</text>
    <text x="32" y="268" font-size="11" fill="#555">nothing is rescheduled until you close this check.</text>

    <text x="20" y="310" font-size="12" fill="#666">Rate your own explanation of what you did say:</text>
    <rect x="20" y="320" width="76" height="26" rx="3" fill="#fff" stroke="#666"/><text x="36" y="338" font-size="11" fill="#333">shaky</text>
    <rect x="104" y="320" width="76" height="26" rx="3" fill="#fff" stroke="#666"/><text x="126" y="338" font-size="11" fill="#333">fine</text>
    <rect x="188" y="320" width="76" height="26" rx="3" fill="#fff" stroke="#666"/><text x="202" y="338" font-size="11" fill="#333">solid</text>

    <rect x="366" y="356" width="134" height="32" rx="4" fill="#333"/>
    <text x="433" y="377" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Close check</text>
  </g>
  <text x="620" y="1018" font-size="12" fill="#666" font-style="italic">Omissions reschedule sooner automatically. Nothing is pushed further out unless you rate it yourself.</text>

  <!-- ============ PANEL 5: REVIEW QUEUE ============ -->
  <g transform="translate(40,1080)">
    <text x="0" y="-10" font-size="13" font-weight="bold" fill="#111">5 · Review queue</text>
    <rect x="0" y="0" width="520" height="400" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="34" fill="#eee" stroke="#333" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="bold" fill="#111">Due today</text>

    <g font-size="13" fill="#222">
      <rect x="20" y="52" width="480" height="40" rx="4" fill="#fff" stroke="#666"/>
      <text x="36" y="70" font-weight="bold">Explain compactness</text>
      <text x="36" y="85" font-size="11" fill="#777">6 points</text>
      <text x="476" y="78" font-size="14" fill="#555">▸</text>

      <rect x="20" y="100" width="480" height="40" rx="4" fill="#fff" stroke="#666"/>
      <text x="36" y="118" font-weight="bold">Explain uniform continuity</text>
      <text x="36" y="133" font-size="11" fill="#777">4 points</text>
      <text x="476" y="126" font-size="14" fill="#555">▸</text>

      <rect x="20" y="148" width="480" height="40" rx="4" fill="#fff" stroke="#666"/>
      <text x="36" y="166" font-weight="bold">Explain Cauchy sequences</text>
      <text x="36" y="181" font-size="11" fill="#777">5 points</text>
      <text x="476" y="174" font-size="14" fill="#555">▸</text>
    </g>

    <line x1="20" y1="208" x2="500" y2="208" stroke="#ccc"/>
    <text x="20" y="228" font-size="11" fill="#666">LOOSE POINTS</text>
    <g font-size="13" fill="#222">
      <rect x="20" y="238" width="480" height="32" rx="4" fill="#fff" stroke="#bbb"/>
      <text x="36" y="258">finite subcover argument</text>
      <rect x="20" y="278" width="480" height="32" rx="4" fill="#fff" stroke="#bbb"/>
      <text x="36" y="298">definition of a limit point</text>
    </g>

    <rect x="20" y="330" width="480" height="46" rx="4" fill="#f7f7f7" stroke="#ddd" stroke-dasharray="4 3"/>
    <text x="32" y="350" font-size="11" fill="#777" font-style="italic">No total count anywhere on this screen. Five rows, not forty-one items.</text>
    <text x="32" y="366" font-size="11" fill="#777" font-style="italic">The arrow expands a topic if you want to see inside it.</text>
  </g>
  <text x="40" y="1508" font-size="12" fill="#666" font-style="italic">Grouped topics appear under their names; ungrouped points appear on their own. The learner decides which is which.</text>

  <!-- ============ PANEL 6: PROMOTION QUEUE ============ -->
  <g transform="translate(620,1080)">
    <text x="0" y="-10" font-size="13" font-weight="bold" fill="#111">6 · Promotion queue</text>
    <rect x="0" y="0" width="520" height="400" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="34" fill="#eee" stroke="#333" stroke-width="1.5"/>
    <text x="14" y="22" font-size="13" font-weight="bold" fill="#111">These have earned a card</text>

    <text x="20" y="58" font-size="11" fill="#666">POINTS YOU KEEP LOSING · NOTHING HERE IS DUE</text>

    <g font-size="13" fill="#222">
      <rect x="20" y="70" width="480" height="56" rx="4" fill="#fff" stroke="#666"/>
      <text x="36" y="92" font-weight="bold">finite subcover argument</text>
      <text x="36" y="110" font-size="11" fill="#777">missed 3 times · compactness</text>
      <rect x="368" y="86" width="116" height="26" rx="3" fill="#333"/>
      <text x="426" y="104" font-size="11" fill="#fff" text-anchor="middle">Write it out</text>

      <rect x="20" y="136" width="480" height="56" rx="4" fill="#fff" stroke="#666"/>
      <text x="36" y="158" font-weight="bold">why closed and bounded isn't enough</text>
      <text x="36" y="176" font-size="11" fill="#777">missed 3 times · compactness</text>
      <rect x="368" y="152" width="116" height="26" rx="3" fill="#333"/>
      <text x="426" y="170" font-size="11" fill="#fff" text-anchor="middle">Write it out</text>

      <rect x="20" y="202" width="480" height="56" rx="4" fill="#fff" stroke="#666"/>
      <text x="36" y="224" font-weight="bold">epsilon-delta vs sequential continuity</text>
      <text x="36" y="242" font-size="11" fill="#777">missed 4 times · continuity</text>
      <rect x="368" y="218" width="116" height="26" rx="3" fill="#333"/>
      <text x="426" y="236" font-size="11" fill="#fff" text-anchor="middle">Write it out</text>
    </g>

    <text x="20" y="288" font-size="12" fill="#06c">dismiss a point</text>

    <rect x="20" y="306" width="480" height="70" rx="4" fill="#f7f7f7" stroke="#ddd"/>
    <text x="32" y="328" font-size="11" fill="#555">Nothing here is overdue and nothing writes itself. A point only</text>
    <text x="32" y="344" font-size="11" fill="#555">reaches this screen after you have failed to produce it three</text>
    <text x="32" y="360" font-size="11" fill="#555">separate times, which is the evidence that it is worth the effort.</text>
  </g>
  <text x="620" y="1508" font-size="12" fill="#666" font-style="italic">The authoring queue. Failures decide what gets written, so authoring effort is proportional to difficulty, not to volume.</text>

</svg>
